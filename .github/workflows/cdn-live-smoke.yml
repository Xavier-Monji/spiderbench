name: Live CDN launch
on:
  push:
    branches: [arena/01a0fb2b-spiderbench]
    paths:
      - 'deployment/launcher.html'
      - 'deployment/launcher.data-uri.txt'
      - 'scripts/smoke-cdn.mjs'
      - '.github/workflows/cdn-live-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      # Deliberately no build, Vite server or response interception. All game files come from jsDelivr.
      - run: npm run test:cdn
        env:
          CDN_LIVE: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-cdn-launch
          path: artifacts/
          retention-days: 7

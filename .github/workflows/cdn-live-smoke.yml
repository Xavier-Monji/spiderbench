name: Live CDN launch
on:
  push:
    branches: [arena/01a0fb2b-spiderbench]
    paths:
      - 'deployment/launcher.html'
      - 'deployment/launcher.data-uri.txt'
      - 'scripts/smoke-cdn.mjs'
      - '.github/workflows/cdn-live-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      # Deliberately no build, Vite server or response interception. All game files come from jsDelivr.
      - run: npm run test:cdn
        env:
          CDN_LIVE: '1'
      - name: CDN diagnostics
        if: always()
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const r=JSON.parse(fs.readFileSync('artifacts/cdn-smoke.json')); console.log('::notice title=CDN smoke report::'+JSON.stringify({...r,stats:{...r.stats,audio:r.stats?.audio?{...r.stats.audio,media:r.stats.audio.media?.map(({src,...m})=>m)}:undefined},abortedMedia:r.abortedMedia.length,requests:r.requests.length,responses:r.responses.filter(v=>v.status>=400)}));"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: live-cdn-launch
          path: artifacts/
          retention-days: 7

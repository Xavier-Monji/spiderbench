<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/src/ui/systems.css"><style>body{margin:0;background:#030720}#sys-root .sys-menu .body{top:0;bottom:0}</style><div id="sys-root"><div class="sys-menu open"><div class="body"></div></div></div><script type="module">
import * as THREE from 'three';
import {createMapPage} from '/src/ui/menus/map.js';
const save={state:{towers:[],stations:[],backpacks:[],landmarks:[],secretPhotos:[],crimes:{stopped:0,byDistrict:{}}}};
const districts=[{id:'test',name:'Midtown',rect:{x0:-820,x1:900,z0:-3540,z1:3390}}];
const pos=(x,y,z)=>new THREE.Vector3(x,y,z);
const data={districts,districtAt:()=>districts[0],towers:[{id:'tower_test',name:'Test Tower',pos:pos(50,15,100)}],stations:[],backpacks:[],landmarks:[],secretPhotos:[]};
for(let i=0;i<25;i++)data.backpacks.push({id:'b'+i,district:'test',pos:pos((i%5-2)*50,15,(Math.floor(i/5)-2)*50),item:'Bag',mount:'roof'});
const features={bounds:{x0:-900,z0:-3600,x1:950,z1:3450},land:[[[-820,-3540],[900,-3540],[900,3390],[-820,3390]]],blocks:[{x0:-100,z0:-100,x1:100,z1:100}],buildings:[{x0:-100,z0:-100,x1:0,z1:0,h:20}],streets:[],parks:[]};
const ctx={world:{getMapFeatures:()=>features},player:{position:pos(0,2,0)},camera:new THREE.PerspectiveCamera()};
const travel={route:null,waypoint:null,update(){},setWaypoint(p){this.waypoint=p;},teleportTo(){},fastTravel(){}};
const noop=()=>{};const audio={sfx:new Proxy({},{get:()=>noop})};
const sys={ctx,data,save,travel,audio,towers:{revealed:id=>save.state.towers.includes('tower_'+id)},crimes:{active:null},pause:{close:noop}};
window.fixture={sys,createMapPage,mount(page){const body=document.querySelector('.body');body.replaceChildren(page.el);page.el.classList.add('page','on');page.show();},pixels(page){page.update(0);const c=page.el.querySelector('canvas');return c.getContext('2d').getImageData(0,0,c.width,c.height).data;}};
window.mapFixture=true;
</script>

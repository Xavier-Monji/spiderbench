<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0}canvas{display:block}</style><script type="module">
import * as THREE from 'three';
import {createCrowd} from '/src/world/npc/crowd.js';
import {buildRoads} from '/src/world/npc/roads.js';
import {createCrowdPoseAtlas} from '/src/render/crowd-poses.js';
const renderer=new THREE.WebGLRenderer({antialias:false});renderer.setSize(400,300);document.body.appendChild(renderer.domElement);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFShadowMap;
const scene=new THREE.Scene();scene.background=new THREE.Color('#152339');scene.add(new THREE.AmbientLight(0xffffff,1));
const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(4,10,4);sun.castShadow=true;sun.shadow.mapSize.set(512,512);sun.shadow.camera.left=-20;sun.shadow.camera.right=20;sun.shadow.camera.top=20;sun.shadow.camera.bottom=-20;scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(100,100).rotateX(-Math.PI/2),new THREE.MeshStandardMaterial({color:'#7b8085'}));ground.receiveShadow=true;scene.add(ground);
const camera=new THREE.PerspectiveCamera(55,4/3,.1,500);camera.position.set(0,3,10);camera.lookAt(0,1,0);
const benches=Array.from({length:12},(_,i)=>({x:(i%4-1.5)*2,z:(Math.floor(i/4)-1)*2,y:.17,ry:0}));
const crowd=await createCrowd({scene,blocks:[],parkPaths:[],props:{benches:()=>benches,carts:()=>[],busStops:()=>[]},roads:buildRoads(),phase:()=>2});
crowd.setPlayer({pos:new THREE.Vector3(0,0,0),vel:new THREE.Vector3(),air:false,ground:0,landT:-9,landPos:null});
for(let i=0;i<9;i++)crowd.update(1/30,camera);
const read=()=>{renderer.setRenderTarget(null);sun.shadow.needsUpdate=true;renderer.render(scene,camera);const p=new Uint8Array(400*300*4),gl=renderer.getContext();gl.readPixels(0,0,400,300,gl.RGBA,gl.UNSIGNED_BYTE,p);return p;};
const before=read();const atlas=createCrowdPoseAtlas(renderer,crowd);atlas.prepare();const after=read();
let different=0,max=0,total=0;for(let i=0;i<before.length;i++){const d=Math.abs(before[i]-after[i]);if(d)different++;max=Math.max(max,d);total+=d;}
window.poseFixture={result:{different,max,meanDifference:total/before.length,components:before.length,people:atlas.stats.people,stats:atlas.stats},atlas,crowd,renderer,camera,scene};
</script>

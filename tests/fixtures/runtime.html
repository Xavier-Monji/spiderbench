<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><script type="module">
import * as THREE from 'three';
import { createTraffic, VTYPES } from '/src/world/npc/traffic.js';
import { buildRoads } from '/src/world/npc/roads.js';
import { createCrowd } from '/src/world/npc/crowd.js';
import { buildBlocks } from '/src/world/layout.js';
const camera=new THREE.PerspectiveCamera(55,1180/820,.1,6000);
const phase=(t,axis)=>{const c=t%40;return axis==='av'?(c<22?2:c<24?1:0):(c<24?0:c<38?2:1)};
function traffic(cacheLinks){
 const geos={hi:{},low:{},far:{}};for(const t of Object.keys(VTYPES)){geos.low[t]=new THREE.BoxGeometry(2,1,1);geos.far[t]=new THREE.BoxGeometry(2,1,1)}
 const mats={hi:new THREE.MeshPhysicalMaterial(),mid:new THREE.MeshPhysicalMaterial(),far:new THREE.MeshStandardMaterial()};
 return createTraffic({scene:new THREE.Scene(),roads:buildRoads(),phase,geos,mats,cacheLinks});
}
const state=c=>c.cars().map(a=>[a.id,a.type,a.link.id,a.s,a.v,a.x,a.y,a.z,a.ry,a.brake,a.conn?.len,a.next?.link.id,a.dead,a._vis]);
window.compareTraffic=()=>{
 const before=traffic(false),after=traffic(true),rnd=Math.random;Math.random=()=>.42;
 try{for(let i=0;i<180;i++){
  const x=i<60?200:i<120?-150:400,z=i<60?100:i<120?400:900;
  camera.position.set(x,8,z);camera.lookAt(x,2,z-100);camera.updateMatrixWorld();
  for(const api of [before,after]){api.setPlayer(new THREE.Vector3(x+5,0,z),new THREE.Vector3(2,0,0),0);if(i===40)api.alarm(new THREE.Vector3(x,0,z),18);api.update(1/30,camera,i/30)}
  if(JSON.stringify(state(before))!==JSON.stringify(state(after)))return {equal:false,frame:i,before:before.stats(),after:after.stats()};
 }
 return {equal:true,frames:180,stats:after.stats()};}finally{Math.random=rnd}
};
window.compareCrowd=async()=>{
 const benches=Array.from({length:4200},(_,i)=>({x:(i%30-15)*50,y:.17,z:(Math.floor(i/30)-70)*45,ry:0}));
 const props={benches:()=>benches,carts:()=>[],busStops:()=>[]}, sceneA=new THREE.Scene(),sceneB=new THREE.Scene();
 const before=await createCrowd({scene:sceneA,blocks:buildBlocks(),parkPaths:[],props,roads:buildRoads(),phase,runtimeCache:false});
 const after=await createCrowd({scene:sceneB,blocks:buildBlocks(),parkPaths:[],props,roads:buildRoads(),phase,runtimeCache:true});
 const snapshot=a=>[a.seed,a.x,a.y,a.z,a.ry,a.mode,a.clip,a.rate,a.lookYaw,a.lookPitch,a._hy,a._or,a.dead,a.react?.kind,a.react?.t];
 for(let i=0;i<90;i++){
  const x=i<30?100:i<60?-150:350,z=i<30?100:i<60?400:-400;
  camera.position.set(x,8,z);camera.lookAt(x,2,z-100);camera.updateMatrixWorld();
  for(const api of [before,after]){
   api.setPlayer({pos:new THREE.Vector3(x,0,z),vel:new THREE.Vector3(1,0,0),air:false,ground:0,landT:-9,landPos:null});
   if(i===20)api.alarm(new THREE.Vector3(x,0,z),30);if(i===25)api.danger('test',new THREE.Vector3(x,0,z),18,true);
   if(i===55)api.danger('test',null,0,false);api.update(1/30,camera);
  }
  for(const k of ['agents','statics']){
   if(before[k].length!==after[k].length)return {equal:false,frame:i,type:k,reason:'count'};
   for(let j=0;j<before[k].length;j++)if(JSON.stringify(snapshot(before[k][j]))!==JSON.stringify(snapshot(after[k][j])))return {equal:false,frame:i,type:k,index:j,before:snapshot(before[k][j]),after:snapshot(after[k][j])};
  }
  for(let j=0;j<before.pools.length;j++){
   const a=before.pools[j],b=after.pools[j];if(a.n!==b.n)return {equal:false,frame:i,pool:j,reason:'render count'};
   for(let k=0;k<a.n*16;k++)if(a.mesh.instanceMatrix.array[k]!==b.mesh.instanceMatrix.array[k])return {equal:false,frame:i,pool:j,reason:'instance matrix'};
  }
  await new Promise(r=>setTimeout(r,0));
 }
 return {equal:true,frames:90,stats:after.stats(),statics:after.statics.length};
};
window.runtimeFixture=true;
</script>
